<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tabla</title>
</head>
<body>
<table border="1">
  <thead>
  <tr>
    <th rowspan="2">Columna 1</th>
    <th>Columna 2</th>
    <th>Columna 3</th>
  </tr>
  </thead>
  <tbody>
  <tr>
    <td>fila 1 col 1</td>
    <td>fila 1 col 2</td>
    <td rowspan="3">fila 1 col 3</td>
  </tr>
  <tr>
    <td colspan="2">fila 2 col 1</td>
  </tr>
  <tr>
    <td>fila 3 col 1</td>
    <td>fila 3 col 2</td>
  </tr>
  </tbody>

</table>
</body>
</html>
